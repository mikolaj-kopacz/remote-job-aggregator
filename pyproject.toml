[project]
name = "remote-job-aggregator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "sqlmodel>=0.0.27",
    "streamlit>=1.51.0",
    "tenacity>=9.1.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "ruff>=0.14.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E/F - Pyflakes/pycodestyle
# I - isort
# B - flake8-bugbear
# UP - pyupgrade